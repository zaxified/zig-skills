# Reviewed findings of NVIDIA SkillSpector (static scan, --no-llm) on skills/zig.
#
# Each rule suppresses one finding: scanner rule id + file + the exact text the
# scanner matched, with the reason it is not a problem. A new finding of the
# same rule in the same file with different matched text is NOT suppressed.
# Rules rather than fingerprints, because v2 fingerprints bind to the hash of
# the whole file: any edit would silently reopen every finding in it, and the
# baseline generator merges repeated occurrences that the scan reports apart.
#
# Most hits are security vocabulary colliding with systems-programming
# vocabulary (memory poisoning, safety checks, control characters).
version: 2
scanner_version: 2.12.0
rules:
  - id: "AE1"
    reason: "Coverage notice, not a content finding: the scanner's reference parser runs under a wall-clock deadline, so how many referenced files it finishes varies with machine load. Every file is fully covered by scripts/audit.py, and every standalone example is compiled by scripts/check-examples.py."
  - id: "RA1"
    path: "references/builtins.md"
    message: "disable safety check"
    reason: "Reference entry for the Zig builtin @setRuntimeSafety; the 'safety checks' are compiler bounds and overflow checks."
  - id: "YR4"
    path: "references/builtins.md"
    message: "llM; disable safety"
    reason: "YARA hit on 'disable safety' in the same @setRuntimeSafety entry; no text addressed to an agent."
  - id: "MP3"
    path: "references/code-review.md"
    message: "Poison memory"
    reason: "'self.* = undefined; // Poison memory' is the Zig idiom that makes use-after-free visible in debug builds."
  - id: "E4"
    path: "references/patterns.md"
    message: "capture context"
    reason: "Closure pattern capturing a Zig context struct with @fieldParentPtr; nothing leaves the program."
  - id: "MP3"
    path: "references/patterns.md"
    message: "corrupt state"
    reason: "errdefer guidance so a partially mutated container is rolled back; program memory, not agent memory."
  - id: "MP3"
    path: "references/std-arraylist.md"
    message: "corrupt state"
    reason: "Same errdefer rollback guidance for ArrayList insertions."
  - id: "MP3"
    path: "references/std-allocators.md"
    message: "reset state"
    reason: "ArenaAllocator.reset(.retain_capacity) in a request loop; allocator API."
  - id: "TM1"
    path: "references/std-ascii.md"
    message: "Delete*"
    reason: "Table of ASCII control-character constants (std.ascii.control_code), DEL among them."
  - id: "AR3"
    path: "references/std-buf-map.md"
    message: "Debug mode enabled"
    reason: "Example prints 'Debug mode enabled' when a DEBUG environment variable is set; not a refusal-suppression phrase."
  - id: "P1"
    path: "references/std-build.md"
    message: "Enable debug mode"
    reason: "Help text of a build option declared with b.option(bool, \"debug\", ...)."
  - id: "TM1"
    path: "references/std-c.md"
    message: "REMOVE*"
    reason: "madvise advice constants (WILLNEED, DONTNEED, FREE, REMOVE) in the std.c reference."
  - id: "PE3"
    path: "references/std-process.md"
    message: "/etc/passwd"
    reason: "Notes that std.process.getUserInfo is broken in 0.16.0 and that a uid can be read from world-readable /etc/passwd instead."
  - id: "MP2"
    path: "references/builtins.md"
    message: "Fill memory"
    reason: "Reference entry for @memset."
  - id: "MP2"
    path: "references/std-io.md"
    message: "Fill buffer"
    reason: "Io.Reader buffering API (fill, buffered, toss)."
  - id: "RA2"
    path: "references/c-interop.md"
    message: "plist"
    reason: "Build walkthrough writes Info.plist into the user's own xcframework output with a heredoc; no persistence."
  - id: "RA2"
    path: "references/c-interop.md"
    message: "PLIST"
    reason: "The same Info.plist heredoc (its DOCTYPE line)."
  - id: "E1"
    path: "references/patterns.md"
    message: "https://api.example.com/"
    reason: "std.http.Client.fetch example against the reserved example host api.example.com."
  - id: "E1"
    path: "references/std-http.md"
    message: "https://api.example.com/"
    reason: "std.http.Client.fetch examples against the reserved example host api.example.com."
fingerprints: []
